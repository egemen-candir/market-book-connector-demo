non_matches:
- entry_id: entry_poterba_summers_long_horizon_mean_reversion_001
  reason: The state requires positive sub-annual autocorrelation that becomes negative
    over three-to-eight-year horizons, together with a measured transitory variance
    component. Current equity declines and persistent selling provide neither the
    horizon-dependent autocorrelation flip nor the transitory-variance behavior.
  reason_code: insufficient_evidence
  state_id: state_poterba_summers_long_horizon_mean_reversion_001
- entry_id: entry_hurst_tsmom_trend_following_001
  reason: The state concerns risk-adjusted time-series-momentum performance across
    a diversified portfolio of 58 liquid futures contracts. The packet describes cash-market
    and sector conditions rather than the futures-portfolio performance the state
    covers.
  reason_code: out_of_scope
  state_id: state_hurst_tsmom_trend_following_001
- entry_id: entry_billio_hedge_fund_illiquidity_003
  reason: The state is explicitly specific to monthly hedge fund returns and position
    illiquidity inferred from high first-order autocorrelation. Hedge funds are outside
    the packet's asset scope.
  reason_code: out_of_scope
  state_id: state_billio_hedge_fund_illiquidity_003
- entry_id: entry_gatev_pairs_mean_reversion_001
  reason: The state describes pair-level equity spread divergences exceeding two standard
    deviations and subsequent convergence within six-month windows. Broad market selling
    supplies no paired securities, equilibrium spreads, divergence thresholds, or
    convergence behavior.
  reason_code: coincidental_neighbor
  state_id: state_gatev_pairs_mean_reversion_001
- entry_id: entry_cho_engle_volume_insignificant_001
  reason: The state concerns the statistical insignificance of option volume for option
    bid-ask spreads after controlling for moneyness, maturity, and activity regime.
    Options and option-spread measurements are outside the packet's scope.
  reason_code: out_of_scope
  state_id: state_cho_engle_volume_insignificant_001
- entry_id: entry_ang_2011_fat_tails_mixture_001
  reason: Large negative market moves do not establish unconditional excess kurtosis,
    negative skewness, or a multi-regime Gaussian mixture data-generating process.
    The distributional behavior defining the state is unmeasured.
  reason_code: insufficient_evidence
  state_id: state_ang_2011_fat_tails_mixture_001
- entry_id: entry_forbes_heteroscedasticity_bias_001
  reason: The state requires an unadjusted cross-market correlation measured during
    elevated source-market variance so that heteroscedasticity bias can be evaluated.
    The packet describes pressure spreading from energy to credit and banks but supplies
    no correlation estimate, variance increase, or corrected comparison.
  reason_code: insufficient_evidence
  state_id: state_forbes_heteroscedasticity_bias_001
- entry_id: entry_lo_mackinlay_short_horizon_predictability_001
  reason: The state is identified by weekly variance ratios above one and significant
    positive first-order autocorrelation, including a size-based gradient. Persistent
    selling and a three-week cumulative decline do not supply variance-ratio, autocorrelation,
    or size-quintile behavior.
  reason_code: insufficient_evidence
  state_id: state_lo_mackinlay_short_horizon_predictability_001
- entry_id: entry_ang_2011_exceedance_asymmetry_003
  reason: The state requires lower-tail joint-exceedance correlations to exceed corresponding
    upper-tail correlations under a regime-switching specification. Simultaneous weakness
    supplies neither the lower-versus-upper-tail comparison nor separate bear-regime
    correlation estimates.
  reason_code: insufficient_evidence
  state_id: state_ang_2011_exceedance_asymmetry_003
- entry_id: entry_nguyen_three_state_hmm_001
  reason: The state is an asset-independent hidden Markov model fitted to daily commodity,
    currency, equity, and fixed-income futures using normalized first- and second-moment
    features. The packet does not cover that modeled futures universe or provide its
    HMM state outputs.
  reason_code: out_of_scope
  state_id: state_nguyen_three_state_hmm_001
- entry_id: entry_ang_bekaert_bear_correlation_002
  reason: The observed downturn agrees with the bear direction, but the state requires
    international equity correlations roughly twenty percentage points above the normal
    regime or an elevated filtered bear-regime probability. Neither behavior is measured
    in the packet.
  reason_code: insufficient_evidence
  state_id: state_ang_bekaert_bear_correlation_002
- entry_id: entry_hamilton_arch_volatility_clustering_004
  reason: Sharp losses and persistent selling do not establish the defining sequence
    of large shocks followed by large shocks. The packet supplies no GARCH persistence
    parameters or significant squared-return autocorrelations.
  reason_code: insufficient_evidence
  state_id: state_hamilton_arch_volatility_clustering_004
- entry_id: entry_cho_engle_underlying_spread_002
  reason: The state concerns option bid-ask spreads driven by underlying-asset spreads
    through delta-scaled hedging costs. The packet contains no options, delta measurements,
    or quoted-spread evidence.
  reason_code: out_of_scope
  state_id: state_cho_engle_underlying_spread_002
- entry_id: entry_cho_engle_market_conditions_004
  reason: The state describes a U-shaped relationship between option transaction rates
    and option bid-ask spreads in fast and slow markets. Quieter dip buying is not
    option transaction-rate evidence, and options are outside the packet's scope.
  reason_code: out_of_scope
  state_id: state_cho_engle_market_conditions_004
- entry_id: entry_hasbrouck_january_effect_004
  reason: The state requires a January-concentrated cross-sectional relationship between
    effective trading costs and future stock returns. The packet supplies no effective-cost
    measurements, return sorts, or evidence of that seasonal premium.
  reason_code: insufficient_evidence
  state_id: state_hasbrouck_january_effect_004
